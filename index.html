<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Player</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.compiled.js"></script>

    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --accent: #e8ff47;
        --accent-dim: #b8cc2a;
        --bg: #080808;
        --surface: #111111;
        --surface2: #1a1a1a;
        --text: #f0f0f0;
        --text-dim: #888;
        --bar-h: 3px;
        --bar-h-hover: 5px;
        --ctrl-h: 52px;
        --radius: 10px;
        --font: "Outfit", sans-serif;
        --mono: "JetBrains Mono", monospace;
        --ease: cubic-bezier(0.4, 0, 0.2, 1);
        --shadow: 0 8px 32px rgba(0, 0, 0, 0.8);
      }

      html,
      body {
        background: var(--bg);
        color: var(--text);
        font-family: var(--font);
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* ── Wrapper ── */
      #player-wrap {
        position: relative;
        width: min(100vw, 177.78vh); /* 16:9 */
        aspect-ratio: 16/9;
        background: #000;
        /*border-radius: var(--radius);*/
        overflow: hidden;
        box-shadow: var(--shadow);
        cursor: none;
      }
      #player-wrap.cursor-visible {
        cursor: default;
      }
      #player-wrap.fullscreen {
        border-radius: 0;
        width: 100vw;
      }

      video {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: contain;
      }

      /* ── Gradient overlays ── */
      .grad-top,
      .grad-bot {
        position: absolute;
        left: 0;
        right: 0;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.3s var(--ease);
      }
      .grad-top {
        top: 0;
        height: 80px;
        background: linear-gradient(to bottom, rgba(0, 0, 0, 0.75), transparent);
      }
      .grad-bot {
        bottom: 0;
        height: 140px;
        background: linear-gradient(to top, rgba(0, 0, 0, 0.85), transparent);
      }
      #player-wrap.ui-visible .grad-top,
      #player-wrap.ui-visible .grad-bot {
        opacity: 1;
      }

      /* ── Title bar ── */
      #title-bar {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        padding: 16px 20px;
        display: flex;
        align-items: center;
        gap: 12px;
        opacity: 0;
        transform: translateY(-6px);
        transition:
          opacity 0.3s var(--ease),
          transform 0.3s var(--ease);
        pointer-events: none;
        z-index: 10;
      }
      #player-wrap.ui-visible #title-bar {
        opacity: 1;
        transform: none;
        pointer-events: auto;
      }

      #title-text {
        font-size: 15px;
        font-weight: 500;
        letter-spacing: 0.01em;
        text-shadow: 0 1px 6px rgba(0, 0, 0, 0.8);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* ── Big play button ── */
      #big-play {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.15s;
        z-index: 5;
      }
      #big-play.show {
        opacity: 1;
        pointer-events: auto;
      }
      #big-play svg {
        width: 72px;
        height: 72px;
        filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.6));
      }

      /* ── Buffering spinner ── */
      #spinner {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s;
        z-index: 6;
      }
      #spinner.show {
        opacity: 1;
      }
      .spin-ring {
        width: 44px;
        height: 44px;
        border: 3px solid rgba(255, 255, 255, 0.15);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* ── Seek flash ── */
      #seek-flash {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
        opacity: 0;
        font-size: 28px;
        font-weight: 600;
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
        z-index: 7;
      }
      #seek-flash.flash {
        animation: flash-anim 0.5s var(--ease) forwards;
      }
      @keyframes flash-anim {
        0% {
          opacity: 1;
          transform: scale(1);
        }
        60% {
          opacity: 1;
          transform: scale(1.05);
        }
        100% {
          opacity: 0;
          transform: scale(0.95);
        }
      }

      /* ── Controls ── */
      #controls {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        padding: 0 16px 14px;
        opacity: 0;
        transform: translateY(6px);
        transition:
          opacity 0.3s var(--ease),
          transform 0.3s var(--ease);
        z-index: 10;
      }
      #player-wrap.ui-visible #controls {
        opacity: 1;
        transform: none;
      }

      /* ── Progress bar ── */
      #progress-wrap {
        position: relative;
        height: 18px;
        display: flex;
        align-items: center;
        cursor: pointer;
        margin-bottom: 4px;
      }
      #progress-track {
        position: relative;
        width: 100%;
        height: var(--bar-h);
        background: rgba(255, 255, 255, 0.18);
        border-radius: 99px;
        transition: height 0.15s var(--ease);
        overflow: visible;
      }
      #progress-wrap:hover #progress-track {
        height: var(--bar-h-hover);
      }

      #progress-buffer {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        background: rgba(255, 255, 255, 0.28);
        border-radius: 99px;
        pointer-events: none;
      }
      #progress-fill {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        background: var(--accent);
        border-radius: 99px;
        pointer-events: none;
      }
      #progress-thumb {
        position: absolute;
        top: 50%;
        right: 0;
        width: 13px;
        height: 13px;
        background: var(--accent);
        border-radius: 50%;
        transform: translate(50%, -50%) scale(0);
        transition: transform 0.15s var(--ease);
        pointer-events: none;
        box-shadow: 0 0 6px rgba(232, 255, 71, 0.5);
      }
      #progress-wrap:hover #progress-thumb {
        transform: translate(50%, -50%) scale(1);
      }

      /* Time tooltip on hover */
      #time-tooltip {
        position: absolute;
        bottom: calc(100% + 10px);
        background: var(--surface2);
        color: var(--text);
        font-family: var(--mono);
        font-size: 12px;
        padding: 4px 8px;
        border-radius: 5px;
        pointer-events: none;
        opacity: 0;
        transform: translateX(-50%);
        white-space: nowrap;
        border: 1px solid rgba(255, 255, 255, 0.08);
        transition: opacity 0.1s;
      }
      #progress-wrap:hover #time-tooltip {
        opacity: 1;
      }

      /* ── Bottom row ── */
      #ctrl-row {
        display: flex;
        align-items: center;
        gap: 4px;
        height: var(--ctrl-h);
      }

      .ctrl-btn {
        background: none;
        border: none;
        color: var(--text);
        width: 40px;
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 8px;
        cursor: pointer;
        transition:
          background 0.15s,
          color 0.15s,
          transform 0.1s;
        flex-shrink: 0;
      }
      .ctrl-btn:hover {
        background: rgba(255, 255, 255, 0.1);
      }
      .ctrl-btn:active {
        transform: scale(0.9);
      }
      .ctrl-btn svg {
        width: 22px;
        height: 22px;
      }

      /* Volume cluster */
      #vol-cluster {
        display: flex;
        align-items: center;
        gap: 2px;
      }
      #vol-slider-wrap {
        width: 0;
        overflow: hidden;
        transition: width 0.2s var(--ease);
        display: flex;
        align-items: center;
      }
      #vol-cluster:hover #vol-slider-wrap,
      #vol-cluster:focus-within #vol-slider-wrap {
        width: 72px;
      }

      #vol-slider {
        appearance: none;
        -webkit-appearance: none;
        width: 64px;
        height: 3px;
        background: rgba(255, 255, 255, 0.2);
        border-radius: 99px;
        outline: none;
        cursor: pointer;
        margin: 0 4px;
      }
      #vol-slider::-webkit-slider-thumb {
        appearance: none;
        -webkit-appearance: none;
        width: 12px;
        height: 12px;
        background: var(--text);
        border-radius: 50%;
        cursor: pointer;
      }

      /* Time display */
      #time-display {
        font-family: var(--mono);
        font-size: 13px;
        color: var(--text);
        white-space: nowrap;
        padding: 0 8px;
        letter-spacing: 0.02em;
        flex-shrink: 0;
      }
      #time-display span {
        color: var(--text-dim);
      }

      .spacer {
        flex: 1;
      }

      /* ── Quality menu ── */
      .menu-wrap {
        position: relative;
      }
      .menu-popup {
        position: absolute;
        bottom: calc(100% + 8px);
        right: 0;
        background: var(--surface);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: var(--radius);
        min-width: 180px;
        overflow: hidden;
        opacity: 0;
        pointer-events: none;
        transform: translateY(6px);
        transition:
          opacity 0.2s var(--ease),
          transform 0.2s var(--ease);
        box-shadow: var(--shadow);
        z-index: 20;
      }
      .menu-popup.open {
        opacity: 1;
        pointer-events: auto;
        transform: none;
      }

      .menu-header {
        padding: 10px 14px 6px;
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--text-dim);
        border-bottom: 1px solid rgba(255, 255, 255, 0.07);
      }
      .menu-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 14px;
        font-size: 14px;
        font-weight: 400;
        cursor: pointer;
        transition: background 0.1s;
        border: none;
        background: none;
        color: var(--text);
        width: 100%;
        text-align: left;
      }
      .menu-item:hover {
        background: rgba(255, 255, 255, 0.07);
      }
      .menu-item.active {
        color: var(--accent);
        font-weight: 500;
      }
      .menu-item .check {
        width: 16px;
        height: 16px;
        flex-shrink: 0;
      }
      .menu-item:not(.active) .check {
        opacity: 0;
      }

      .menu-badge {
        margin-left: auto;
        font-family: var(--mono);
        font-size: 11px;
        color: var(--text-dim);
        background: rgba(255, 255, 255, 0.07);
        padding: 2px 6px;
        border-radius: 4px;
      }

      /* Speed menu */
      #speed-menu .menu-item {
        justify-content: space-between;
      }

      /* ── Settings label ── */
      #quality-label {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--accent);
        pointer-events: none;
        position: absolute;
        top: 2px;
        right: 2px;
        line-height: 1;
      }
      #quality-btn {
        position: relative;
      }

      /* ── HDR badge ── */
      #hdr-badge {
        font-family: var(--mono);
        font-size: 10px;
        font-weight: 500;
        padding: 2px 6px;
        border: 1px solid rgba(232, 255, 71, 0.4);
        color: var(--accent);
        border-radius: 4px;
        letter-spacing: 0.06em;
        display: none;
        flex-shrink: 0;
      }
      #hdr-badge.show {
        display: block;
      }

      /* ── Codec badge ── */
      #codec-badge {
        font-family: var(--mono);
        font-size: 10px;
        font-weight: 500;
        padding: 2px 6px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        color: var(--text-dim);
        border-radius: 4px;
        letter-spacing: 0.06em;
        display: none;
        flex-shrink: 0;
      }
      #codec-badge.show {
        display: block;
      }

      /* ── Keyboard shortcut toast ── */
      #kb-toast {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: rgba(0, 0, 0, 0.75);
        border: 1px solid rgba(255, 255, 255, 0.12);
        color: var(--text);
        font-size: 14px;
        font-weight: 500;
        padding: 8px 16px;
        border-radius: 8px;
        pointer-events: none;
        opacity: 0;
        z-index: 8;
        backdrop-filter: blur(8px);
      }
      #kb-toast.show {
        animation: toast-anim 0.9s var(--ease) forwards;
      }
      @keyframes toast-anim {
        0% {
          opacity: 0;
          transform: translate(-50%, -50%) scale(0.9);
        }
        15% {
          opacity: 1;
          transform: translate(-50%, -50%) scale(1);
        }
        70% {
          opacity: 1;
        }
        100% {
          opacity: 0;
          transform: translate(-50%, -50%) scale(0.97);
        }
      }

      /* Fullscreen adjustments */
      :fullscreen #player-wrap {
        border-radius: 0;
      }
    </style>
  </head>
  <body>
    <div id="player-wrap">
      <video id="video" playsinline></video>

      <div class="grad-top"></div>
      <div class="grad-bot"></div>

      <!-- Title -->
      <div id="title-bar">
        <div id="hdr-badge">HDR</div>
        <div id="codec-badge">AV1</div>
        <div id="title-text">Video Title</div>
      </div>

      <!-- Big play -->
      <div id="big-play" class="show">
        <svg viewBox="0 0 72 72" fill="none">
          <circle
            cx="36"
            cy="36"
            r="35"
            fill="rgba(0,0,0,.55)"
            stroke="rgba(255,255,255,.25)"
            stroke-width="1"
          />
          <polygon points="28,20 56,36 28,52" fill="white" />
        </svg>
      </div>

      <!-- Buffering -->
      <div id="spinner"><div class="spin-ring"></div></div>

      <!-- Seek flash -->
      <div id="seek-flash"></div>

      <!-- Keyboard toast -->
      <div id="kb-toast"></div>

      <!-- Controls -->
      <div id="controls">
        <!-- Progress -->
        <div id="progress-wrap">
          <div id="progress-track">
            <div id="progress-buffer"></div>
            <div id="progress-fill"></div>
            <div id="progress-thumb"></div>
          </div>
          <div id="time-tooltip">0:00</div>
        </div>

        <!-- Bottom row -->
        <div id="ctrl-row">
          <!-- Play/Pause -->
          <button class="ctrl-btn" id="play-btn" title="Play (k)">
            <svg id="play-icon" viewBox="0 0 24 24" fill="currentColor">
              <polygon points="5,3 19,12 5,21" />
            </svg>
          </button>

          <!-- Skip back -->
          <button class="ctrl-btn" id="back-btn" title="–10s (j)">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <polyline points="1 4 1 10 7 10" />
              <path d="M3.51 15a9 9 0 1 0 .49-4.5" />
              <text
                x="9"
                y="15"
                font-size="6"
                fill="currentColor"
                stroke="none"
                font-family="Outfit"
              >
                10
              </text>
            </svg>
          </button>

          <!-- Skip forward -->
          <button class="ctrl-btn" id="fwd-btn" title="+10s (l)">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <polyline points="23 4 23 10 17 10" />
              <path d="M20.49 15a9 9 0 1 1-.49-4.5" />
              <text
                x="9"
                y="15"
                font-size="6"
                fill="currentColor"
                stroke="none"
                font-family="Outfit"
              >
                10
              </text>
            </svg>
          </button>

          <!-- Volume -->
          <div id="vol-cluster">
            <button class="ctrl-btn" id="mute-btn" title="Mute (m)">
              <svg
                id="vol-icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
                <path id="vol-wave-1" d="M19.07 4.93a10 10 0 0 1 0 14.14" />
                <path id="vol-wave-2" d="M15.54 8.46a5 5 0 0 1 0 7.07" />
              </svg>
            </button>
            <div id="vol-slider-wrap">
              <input type="range" id="vol-slider" min="0" max="1" step="0.01" value="1" />
            </div>
          </div>

          <!-- Time -->
          <div id="time-display">
            <span id="cur-time">0:00</span><span> / </span><span id="dur-time">0:00</span>
          </div>

          <div class="spacer"></div>

          <!-- Speed -->
          <div class="menu-wrap">
            <button class="ctrl-btn" id="speed-btn" title="Playback speed">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <circle cx="12" cy="12" r="10" />
                <polyline points="12 6 12 12 16 14" />
              </svg>
            </button>
            <div class="menu-popup" id="speed-menu">
              <div class="menu-header">Speed</div>
              <button class="menu-item" data-speed="0.25">0.25×</button>
              <button class="menu-item" data-speed="0.5">0.5×</button>
              <button class="menu-item" data-speed="0.75">0.75×</button>
              <button class="menu-item active" data-speed="1">Normal</button>
              <button class="menu-item" data-speed="1.25">1.25×</button>
              <button class="menu-item" data-speed="1.5">1.5×</button>
              <button class="menu-item" data-speed="2">2×</button>
            </div>
          </div>

          <!-- Quality -->
          <div class="menu-wrap">
            <button class="ctrl-btn" id="quality-btn" title="Quality">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <rect x="2" y="3" width="20" height="14" rx="2" />
                <line x1="8" y1="21" x2="16" y2="21" />
                <line x1="12" y1="17" x2="12" y2="21" />
              </svg>
              <span id="quality-label">Auto</span>
            </button>
            <div class="menu-popup" id="quality-menu">
              <div class="menu-header">Quality</div>
            </div>
          </div>

          <!-- Fullscreen -->
          <button class="ctrl-btn" id="fs-btn" title="Fullscreen (f)">
            <svg
              id="fs-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <polyline points="15 3 21 3 21 9" />
              <polyline points="9 21 3 21 3 15" />
              <line x1="21" y1="3" x2="14" y2="10" />
              <line x1="3" y1="21" x2="10" y2="14" />
            </svg>
          </button>
        </div>
      </div>
    </div>

    <script>
      // ── Config ─────────────────────────────────────────────────────────────────────
      const CONFIG = {
        title: "2160p60 HDR",
        av1Dash: "https://f003.backblazeb2.com/file/ProjectAida/2160p60+HDR/AV1/manifest.mpd",
        h265Dash: "https://f003.backblazeb2.com/file/ProjectAida/2160p60+HDR/H265/manifest.mpd",
        h265Hls: "https://f003.backblazeb2.com/file/ProjectAida/2160p60+HDR/H265/master.m3u8",
        isHdr: true,
      };

      /*
      const CONFIG = {
        title:      "Your Video Title",
        av1Dash:    "https://your-cdn.com/video/AV1/manifest.mpd",
        h265Dash:   "https://your-cdn.com/video/H265/manifest.mpd",
        h265Hls:    "https://your-cdn.com/video/H265/master.m3u8",
        isHdr:      true,
      };
      */

      // ── Codec detection ─────────────────────────────────────────────────────────────
      function isApple() {
        return (
          /iPad|iPhone|iPod/.test(navigator.userAgent) ||
          (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1) ||
          /^((?!chrome|android).)*safari/i.test(navigator.userAgent)
        );
      }

      async function supportsAV1() {
        if (isApple()) return false;
        try {
          const r = await navigator.mediaCapabilities?.decodingInfo({
            type: "media-source",
            video: {
              contentType: 'video/mp4; codecs="av01.0.08M.10"',
              width: 3840,
              height: 2160,
              bitrate: 20000000,
              framerate: 120,
            },
          });
          return r?.supported ?? false;
        } catch {
          return false;
        }
      }

      // ── Elements ───────────────────────────────────────────────────────────────────
      const wrap = document.getElementById("player-wrap");
      const video = document.getElementById("video");
      const bigPlay = document.getElementById("big-play");
      const spinner = document.getElementById("spinner");
      const seekFlash = document.getElementById("seek-flash");
      const kbToast = document.getElementById("kb-toast");
      const playBtn = document.getElementById("play-btn");
      const playIcon = document.getElementById("play-icon");
      const muteBtn = document.getElementById("mute-btn");
      const volSlider = document.getElementById("vol-slider");
      const backBtn = document.getElementById("back-btn");
      const fwdBtn = document.getElementById("fwd-btn");
      const curTime = document.getElementById("cur-time");
      const durTime = document.getElementById("dur-time");
      const fsBtn = document.getElementById("fs-btn");
      const fsIcon = document.getElementById("fs-icon");
      const progWrap = document.getElementById("progress-wrap");
      const progFill = document.getElementById("progress-fill");
      const progBuf = document.getElementById("progress-buffer");
      const progThumb = document.getElementById("progress-thumb");
      const timeTip = document.getElementById("time-tooltip");
      const qualBtn = document.getElementById("quality-btn");
      const qualMenu = document.getElementById("quality-menu");
      const qualLabel = document.getElementById("quality-label");
      const speedBtn = document.getElementById("speed-btn");
      const speedMenu = document.getElementById("speed-menu");
      const hdrBadge = document.getElementById("hdr-badge");
      const codecBadge = document.getElementById("codec-badge");
      const titleText = document.getElementById("title-text");

      // ── State ──────────────────────────────────────────────────────────────────────
      let player,
        uiTimer,
        isDragging = false,
        selectedQuality = -1; // -1 = auto

      // ── Init ───────────────────────────────────────────────────────────────────────
      async function init() {
        shaka.polyfill.installAll();
        if (!shaka.Player.isBrowserSupported()) {
          alert("Your browser does not support this player.");
          return;
        }

        player = new shaka.Player();
        await player.attach(video);

        player.configure({
          streaming: {
            bufferingGoal: 30,
            rebufferingGoal: 2,
            bufferBehind: 30,
            retryParameters: { maxAttempts: 4, baseDelay: 1000, backoffFactor: 2 },
          },
          abr: { enabled: true },
        });

        player.addEventListener("error", (e) => console.error("Shaka error", e.detail));
        player.addEventListener("buffering", (e) => spinner.classList.toggle("show", e.buffering));
        player.addEventListener("adaptation", updateQualityLabel);
        player.addEventListener("variantchanged", updateQualityLabel);

        titleText.textContent = CONFIG.title;
        if (CONFIG.isHdr) hdrBadge.classList.add("show");

        const useAV1 = await supportsAV1();
        let src, mime;

        if (useAV1) {
          src = CONFIG.av1Dash;
          mime = "application/dash+xml";
          codecBadge.textContent = "AV1";
          codecBadge.classList.add("show");
        } else if (isApple()) {
          src = CONFIG.h265Hls;
          mime = "application/x-mpegURL";
          codecBadge.textContent = "H.265";
          codecBadge.classList.add("show");
        } else {
          src = CONFIG.h265Dash;
          mime = "application/dash+xml";
          codecBadge.textContent = "H.265";
          codecBadge.classList.add("show");
        }

        try {
          await player.load(src, null, mime);
          buildQualityMenu();
        } catch (e) {
          console.error("Load failed", e);
        }
      }

      // ── Formatting ─────────────────────────────────────────────────────────────────
      function fmt(s) {
        s = Math.max(0, Math.floor(s));
        const h = Math.floor(s / 3600);
        const m = Math.floor((s % 3600) / 60);
        const sec = s % 60;
        if (h) return `${h}:${String(m).padStart(2, "0")}:${String(sec).padStart(2, "0")}`;
        return `${m}:${String(sec).padStart(2, "0")}`;
      }

      // ── Play / Pause ───────────────────────────────────────────────────────────────
      const PLAY_SVG = '<polygon points="5,3 19,12 5,21"/>';
      const PAUSE_SVG =
        '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>';

      function setPlayIcon(playing) {
        playIcon.innerHTML = playing ? PAUSE_SVG : PLAY_SVG;
      }

      function togglePlay() {
        if (video.paused) {
          video.play();
          bigPlay.classList.remove("show");
        } else {
          video.pause();
          bigPlay.classList.add("show");
        }
      }

      video.addEventListener("play", () => setPlayIcon(true));
      video.addEventListener("pause", () => setPlayIcon(false));
      video.addEventListener("ended", () => {
        setPlayIcon(false);
        bigPlay.classList.add("show");
      });

      playBtn.addEventListener("click", togglePlay);
      bigPlay.addEventListener("click", togglePlay);
      video.addEventListener("click", togglePlay);

      // ── Volume ─────────────────────────────────────────────────────────────────────
      const VOL_FULL = `<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
  <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
  <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>`;
      const VOL_MUTE = `<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
  <line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/>`;
      const VOL_LOW = `<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
  <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>`;

      function updateVolIcon() {
        const v = video.volume,
          m = video.muted;
        document.getElementById("vol-icon").innerHTML =
          m || v === 0 ? VOL_MUTE
          : v < 0.5 ? VOL_LOW
          : VOL_FULL;
      }

      muteBtn.addEventListener("click", () => {
        video.muted = !video.muted;
        updateVolIcon();
      });

      volSlider.addEventListener("input", () => {
        video.volume = parseFloat(volSlider.value);
        video.muted = video.volume === 0;
        updateVolIcon();
      });

      video.addEventListener("volumechange", () => {
        volSlider.value = video.muted ? 0 : video.volume;
        updateVolIcon();
      });

      // ── Progress ───────────────────────────────────────────────────────────────────
      function getProgressX(e) {
        const rect = progWrap.getBoundingClientRect();
        return Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      }

      function applyProgress(frac) {
        progFill.style.width = frac * 100 + "%";
        progThumb.style.right = -0.5 + "px";
        progThumb.style.left = frac * 100 + "%";
      }

      video.addEventListener("timeupdate", () => {
        if (isDragging || !video.duration) return;
        const frac = video.currentTime / video.duration;
        applyProgress(frac);
        curTime.textContent = fmt(video.currentTime);

        // Buffer
        if (video.buffered.length) {
          const end = video.buffered.end(video.buffered.length - 1);
          progBuf.style.width = (end / video.duration) * 100 + "%";
        }
      });

      video.addEventListener("loadedmetadata", () => {
        durTime.textContent = fmt(video.duration);
      });

      progWrap.addEventListener("mousemove", (e) => {
        const frac = getProgressX(e);
        const rect = progWrap.getBoundingClientRect();
        timeTip.textContent = fmt(frac * (video.duration || 0));
        timeTip.style.left = e.clientX - rect.left + "px";
      });

      progWrap.addEventListener("mousedown", (e) => {
        isDragging = true;
        const frac = getProgressX(e);
        applyProgress(frac);
      });

      document.addEventListener("mousemove", (e) => {
        if (!isDragging) return;
        const frac = getProgressX(e);
        applyProgress(frac);
        curTime.textContent = fmt(frac * (video.duration || 0));
      });

      document.addEventListener("mouseup", (e) => {
        if (!isDragging) return;
        isDragging = false;
        const frac = getProgressX(e);
        video.currentTime = frac * video.duration;
      });

      // ── Skip ───────────────────────────────────────────────────────────────────────
      function skip(sec) {
        video.currentTime = Math.max(0, Math.min(video.duration, video.currentTime + sec));
        flashSeek(sec > 0 ? `+${sec}s` : `${sec}s`);
      }

      backBtn.addEventListener("click", () => skip(-10));
      fwdBtn.addEventListener("click", () => skip(10));

      function flashSeek(txt) {
        seekFlash.textContent = txt;
        seekFlash.classList.remove("flash");
        void seekFlash.offsetWidth;
        seekFlash.classList.add("flash");
      }

      // ── UI visibility ──────────────────────────────────────────────────────────────
      function showUI() {
        wrap.classList.add("ui-visible", "cursor-visible");
        clearTimeout(uiTimer);
        if (!video.paused) uiTimer = setTimeout(hideUI, 3000);
      }

      function hideUI() {
        if (isAnyMenuOpen()) return;
        wrap.classList.remove("ui-visible", "cursor-visible");
      }

      function isAnyMenuOpen() {
        return qualMenu.classList.contains("open") || speedMenu.classList.contains("open");
      }

      wrap.addEventListener("mousemove", showUI);
      wrap.addEventListener("mouseleave", () => {
        if (!video.paused) hideUI();
      });

      // Show on pause
      video.addEventListener("pause", showUI);
      video.addEventListener("play", () => {
        clearTimeout(uiTimer);
        uiTimer = setTimeout(hideUI, 3000);
      });

      // ── Menus ──────────────────────────────────────────────────────────────────────
      function toggleMenu(menu, btn) {
        const isOpen = menu.classList.contains("open");
        closeAllMenus();
        if (!isOpen) {
          menu.classList.add("open");
          showUI();
        }
      }

      function closeAllMenus() {
        qualMenu.classList.remove("open");
        speedMenu.classList.remove("open");
      }

      qualBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        toggleMenu(qualMenu, qualBtn);
      });
      speedBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        toggleMenu(speedMenu, speedBtn);
      });
      document.addEventListener("click", closeAllMenus);
      qualMenu.addEventListener("click", (e) => e.stopPropagation());
      speedMenu.addEventListener("click", (e) => e.stopPropagation());

      // ── Quality menu ───────────────────────────────────────────────────────────────
      function buildQualityMenu() {
        if (!player) return;
        const tracks = player.getVariantTracks();

        // Deduplicate by height, keep highest bandwidth per height
        const byHeight = {};
        tracks.forEach((t) => {
          if (!byHeight[t.height] || t.bandwidth > byHeight[t.height].bandwidth)
            byHeight[t.height] = t;
        });

        const sorted = Object.values(byHeight).sort((a, b) => b.height - a.height);

        qualMenu.innerHTML = '<div class="menu-header">Quality</div>';

        // Auto
        const autoItem = document.createElement("button");
        autoItem.className = "menu-item active";
        autoItem.dataset.id = "-1";
        autoItem.innerHTML = `
    <svg class="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="20 6 9 17 4 12"/>
    </svg>
    Auto
    <span class="menu-badge">ABR</span>`;
        autoItem.addEventListener("click", () => selectQuality(-1));
        qualMenu.appendChild(autoItem);

        sorted.forEach((track) => {
          const item = document.createElement("button");
          item.className = "menu-item";
          item.dataset.id = track.id;
          const kbps = Math.round(track.bandwidth / 1000);
          const fps = track.frameRate ? Math.round(track.frameRate) : "";
          item.innerHTML = `
      <svg class="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
      ${track.height}p${fps ? " " + fps + "fps" : ""}
      <span class="menu-badge">${kbps > 1000 ? (kbps / 1000).toFixed(1) + " Mbps" : kbps + " kbps"}</span>`;
          item.addEventListener("click", () => selectQuality(track.id));
          qualMenu.appendChild(item);
        });

        updateQualityLabel();
      }

      function selectQuality(id) {
        selectedQuality = id;
        if (id === -1) {
          player.configure("abr.enabled", true);
          qualLabel.textContent = "Auto";
        } else {
          player.configure("abr.enabled", false);
          const track = player.getVariantTracks().find((t) => t.id === id);
          if (track) {
            player.selectVariantTrack(track, true);
            qualLabel.textContent = track.height + "p";
          }
        }
        // Update checkmarks
        qualMenu.querySelectorAll(".menu-item").forEach((item) => {
          item.classList.toggle("active", parseInt(item.dataset.id) === id);
        });
        closeAllMenus();
      }

      function updateQualityLabel() {
        if (selectedQuality !== -1 || !player) return;
        const active = player.getVariantTracks().find((t) => t.active);
        if (active) qualLabel.textContent = "Auto · " + active.height + "p";
      }

      // ── Speed menu ─────────────────────────────────────────────────────────────────
      speedMenu.querySelectorAll(".menu-item[data-speed]").forEach((item) => {
        item.addEventListener("click", () => {
          const spd = parseFloat(item.dataset.speed);
          video.playbackRate = spd;
          speedMenu.querySelectorAll(".menu-item").forEach((i) => i.classList.remove("active"));
          item.classList.add("active");
          showToast(spd === 1 ? "Normal speed" : `${spd}× speed`);
          closeAllMenus();
        });
      });

      // ── Fullscreen ─────────────────────────────────────────────────────────────────
      const FS_ENTER = `<polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/>
  <line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/>`;
      const FS_EXIT = `<polyline points="4 14 10 14 10 20"/><polyline points="20 4 14 4 14 10"/>
  <line x1="10" y1="14" x2="3" y2="21"/><line x1="21" y1="3" x2="14" y2="10"/>`;

      function toggleFS() {
        if (!document.fullscreenElement) wrap.requestFullscreen();
        else document.exitFullscreen();
      }

      fsBtn.addEventListener("click", toggleFS);
      document.addEventListener("fullscreenchange", () => {
        const isFs = !!document.fullscreenElement;
        fsIcon.innerHTML = isFs ? FS_EXIT : FS_ENTER;
        wrap.classList.toggle("fullscreen", isFs);
      });

      // ── Keyboard ───────────────────────────────────────────────────────────────────
      function showToast(msg) {
        kbToast.textContent = msg;
        kbToast.classList.remove("show");
        void kbToast.offsetWidth;
        kbToast.classList.add("show");
      }

      document.addEventListener("keydown", (e) => {
        if (["INPUT", "TEXTAREA"].includes(document.activeElement.tagName)) return;
        showUI();
        switch (e.key) {
          case " ":
          case "k":
            e.preventDefault();
            togglePlay();
            showToast(video.paused ? "Paused" : "Playing");
            break;
          case "j":
            skip(-10);
            break;
          case "l":
            skip(10);
            break;
          case "ArrowLeft":
            e.preventDefault();
            skip(-5);
            showToast("−5s");
            break;
          case "ArrowRight":
            e.preventDefault();
            skip(5);
            showToast("+5s");
            break;
          case "ArrowUp":
            e.preventDefault();
            video.volume = Math.min(1, video.volume + 0.1);
            showToast(`Volume ${Math.round(video.volume * 100)}%`);
            break;
          case "ArrowDown":
            e.preventDefault();
            video.volume = Math.max(0, video.volume - 0.1);
            showToast(`Volume ${Math.round(video.volume * 100)}%`);
            break;
          case "m":
            video.muted = !video.muted;
            showToast(video.muted ? "Muted" : "Unmuted");
            break;
          case "f":
            toggleFS();
            break;
          case "Home":
            video.currentTime = 0;
            showToast("Start");
            break;
          case "End":
            video.currentTime = video.duration;
            break;
        }
        // Number keys 0-9 → seek to percentage
        if (e.key >= "0" && e.key <= "9") {
          const pct = parseInt(e.key) / 10;
          video.currentTime = pct * video.duration;
          showToast(`${pct * 100}%`);
        }
      });

      // ── Start ──────────────────────────────────────────────────────────────────────
      init();
    </script>
  </body>
</html>
