<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Aida — Debug</title>
    <link rel="icon" type="image/x-icon" href="favicon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <script src="https://cdn.jsdelivr.net/npm/shaka-player@5.0.7/dist/shaka-player.compiled.min.js"></script>

    <link rel="stylesheet" href="../style.css" />
    <link rel="stylesheet" href="../css/player.css" />
    <link rel="stylesheet" href="style.css" />

    <script defer src="../js/player.js"></script>
    <script defer src="../js/loader.js"></script>
    <script defer src="main.js"></script>
  </head>
  <body>
    <div id="player-wrap">
      <video id="video" playsinline></video>

      <div class="grad-top"></div>
      <div class="grad-bot"></div>

      <div id="title-bar">
        <div id="title-text">Video Title</div>
        <div class="title-spacer"></div>
        <div class="badge-accent" id="hdr-badge">HDR</div>
        <div class="badge-accent" id="codec-badge">AV1</div>
        <div class="badge-accent" id="protocol-badge">DASH</div>
        <div class="badge-accent show" id="debug-badge">DEBUG</div>
      </div>

      <div id="big-play" class="show">
        <svg viewBox="0 0 72 72" fill="none">
          <circle
            cx="36"
            cy="36"
            r="35"
            fill="rgba(0,0,0,.55)"
            stroke="rgba(255,255,255,.25)"
            stroke-width="1"
          />
          <polygon points="28,20 56,36 28,52" fill="white" />
        </svg>
      </div>

      <div id="spinner"><div class="spin-ring"></div></div>
      <div id="seek-flash"></div>
      <div id="kb-toast"></div>

      <div id="controls">
        <div id="progress-wrap">
          <div id="progress-track">
            <div id="progress-buffer"></div>
            <div id="progress-fill"></div>
            <div id="progress-thumb"></div>
          </div>
          <div id="time-tooltip">0:00</div>
        </div>

        <div id="ctrl-row">
          <button class="ctrl-btn" id="play-btn" title="Play (k)">
            <svg id="play-icon" viewBox="0 0 24 24" fill="currentColor">
              <polygon points="5,3 19,12 5,21" />
            </svg>
          </button>

          <button class="ctrl-btn" id="back-btn" title="–10s (j)">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <polyline points="1 4 1 10 7 10" />
              <path d="M3.51 15a9 9 0 1 0 .49-4.5" />
              <text
                x="9"
                y="15"
                font-size="6"
                fill="currentColor"
                stroke="none"
                font-family="Outfit"
              >
                10
              </text>
            </svg>
          </button>

          <button class="ctrl-btn" id="fwd-btn" title="+10s (l)">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <polyline points="23 4 23 10 17 10" />
              <path d="M20.49 15a9 9 0 1 1-.49-4.5" />
              <text
                x="9"
                y="15"
                font-size="6"
                fill="currentColor"
                stroke="none"
                font-family="Outfit"
              >
                10
              </text>
            </svg>
          </button>

          <div id="vol-cluster">
            <button class="ctrl-btn" id="mute-btn" title="Mute (m)">
              <svg
                id="vol-icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
                <path id="vol-wave-1" d="M19.07 4.93a10 10 0 0 1 0 14.14" />
                <path id="vol-wave-2" d="M15.54 8.46a5 5 0 0 1 0 7.07" />
              </svg>
            </button>
            <div id="vol-slider-wrap">
              <input type="range" id="vol-slider" min="0" max="1" step="0.01" value="0.5" />
            </div>
          </div>

          <div id="time-display">
            <span id="cur-time">0:00</span><span> / </span><span id="dur-time">0:00</span>
          </div>

          <div class="spacer"></div>

          <div class="menu-wrap">
            <button class="ctrl-btn" id="speed-btn" title="Playback speed">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <circle cx="12" cy="12" r="10" />
                <polyline points="12 6 12 12 16 14" />
              </svg>
            </button>
            <div class="menu-popup" id="speed-menu">
              <div class="menu-header">Speed</div>
              <button class="menu-item" data-speed="0.25">0.25×</button>
              <button class="menu-item" data-speed="0.5">0.5×</button>
              <button class="menu-item" data-speed="0.75">0.75×</button>
              <button class="menu-item active" data-speed="1">Normal</button>
              <button class="menu-item" data-speed="1.25">1.25×</button>
              <button class="menu-item" data-speed="1.5">1.5×</button>
              <button class="menu-item" data-speed="2">2×</button>
            </div>
          </div>

          <button class="ctrl-btn" id="tm-btn" title="Tonemapping" style="display: none">
            Tonemapping
          </button>

          <div class="menu-wrap">
            <button class="ctrl-btn" id="quality-btn" title="Quality">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <rect x="2" y="3" width="20" height="14" rx="2" />
                <line x1="8" y1="21" x2="16" y2="21" />
                <line x1="12" y1="17" x2="12" y2="21" />
              </svg>
              <span id="quality-label">Auto</span>
            </button>
            <div class="menu-popup" id="quality-menu">
              <div class="menu-header">Quality</div>
            </div>
          </div>

          <button class="ctrl-btn" id="fs-btn" title="Fullscreen (f)">
            <svg
              id="fs-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <polyline points="15 3 21 3 21 9" />
              <polyline points="9 21 3 21 3 15" />
              <line x1="21" y1="3" x2="14" y2="10" />
              <line x1="3" y1="21" x2="10" y2="14" />
            </svg>
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
