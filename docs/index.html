<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Aida</title>
    <link rel="icon" type="image/x-icon" href="assets/favicons/index.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/index.css" />
    <script defer src="js/index.js"></script>
  </head>
  <body>
    <!-- Logo / Home link -->
    <div id="logo-link">
      <a href="/">
        <img src="assets/favicons/index.svg" alt="Project Aida" />
      </a>
    </div>

    <main>
      <!-- Search bar -->
      <div id="search-container">
        <div id="search-wrap">
          <svg
            class="search-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="11" cy="11" r="8" />
            <path d="m21 21-4.35-4.35" />
          </svg>
          <input type="text" id="search-input" placeholder="Search videos..." autocomplete="off" />
        </div>
      </div>

      <!-- Hero section -->
      <section id="hero">
        <div id="hero-skeleton" class="skeleton-hero">
          <div class="skeleton-thumbnail"></div>
          <div class="skeleton-content">
            <div class="skeleton-title"></div>
            <div class="skeleton-desc"></div>
            <div class="skeleton-desc"></div>
            <div class="skeleton-meta"></div>
          </div>
        </div>
        <a id="hero-content" href="" style="display: none">
          <img id="hero-img" src="" alt="" />
          <div class="hero-info">
            <h1 id="hero-title"></h1>
            <p id="hero-desc"></p>
            <div class="hero-meta">
              <span id="hero-date"></span>
              <span id="hero-duration"></span>
            </div>
          </div>
        </a>
      </section>

      <!-- Video grid -->
      <section id="videos">
        <div id="videos-grid"></div>
      </section>

      <!-- No results message -->
      <div
        id="no-results"
        style="display: none; text-align: center; padding: 40px; color: var(--text-dim)"
      >
        <p>No videos found.</p>
      </div>
    </main>
  </body>
</html>
