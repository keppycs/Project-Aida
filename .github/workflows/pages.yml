name: Deploy website to Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "scripts/stage-public-site.mjs"
      - "tests/stage-public-site.test.mjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  secrets:
    permissions:
      contents: read
    uses: ./.github/workflows/security.yml

  deploy:
    needs: secrets
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Verify public asset staging
        run: node --test tests/stage-public-site.test.mjs
      - name: Stage public website
        run: node scripts/stage-public-site.mjs logs/pages-public
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: logs/pages-public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
