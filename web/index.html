<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Explore Aida's videos. High frame rates, vivid detail, and a player built for watching." />
    <meta name="theme-color" content="#101112" />
    <title>Aida — Videos</title>
    <link rel="icon" href="assets/favicons/flushed.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="css/site.css?v=ux-audit-v1" />
    <link rel="stylesheet" href="css/index.css?v=ux-audit-v1" />
    <script defer src="js/site-env.js?v=ux-stability-v14"></script>
    <script defer src="js/ui.js?v=ux-baseline-v2"></script>
    <script type="module" src="js/index.js?v=ux-baseline-v2"></script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header class="site-header site-header-search">
      <a class="brand" href="./" aria-label="Aida home">
        <span class="brand-mark" aria-hidden="true">a</span>
        <span class="brand-copy"><span class="brand-name">aida</span></span>
      </a>
      <form id="search-form" class="search-wrap" role="search">
        <div class="search-field">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="10.5" cy="10.5" r="7" /><path d="m16 16 4.5 4.5" /></svg>
          <input type="search" id="search-input" aria-label="Search" placeholder="Search" autocomplete="off" spellcheck="false" disabled />
          <button id="search-clear" class="search-clear" type="button" aria-label="Clear search" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" /></svg></button>
        </div>
      </form>
    </header>

    <main class="site-main videos-main" id="main-content" tabindex="-1">
      <section id="hero" class="featured-section" aria-label="Latest video" aria-busy="true">
        <div id="hero-skeleton" class="featured-skeleton" aria-hidden="true">
          <div class="skeleton-block featured-skeleton-image"></div>
          <div class="featured-skeleton-copy"><div class="skeleton-block skeleton-kicker"></div><div class="skeleton-block skeleton-title"></div><div class="skeleton-block skeleton-line"></div><div class="skeleton-block skeleton-line short"></div><div class="skeleton-block skeleton-button"></div></div>
        </div>
        <article id="hero-content" class="featured" hidden>
          <a id="hero-image-link" class="featured-image" href="watch.html" tabindex="-1" aria-hidden="true">
            <div id="hero-img" class="thumbnail-shell"></div>
            <span class="featured-play" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z" /></svg></span>
            <span id="hero-image-duration" class="thumbnail-duration" hidden></span>
          </a>
          <div class="featured-copy">
            <p class="eyebrow"><span class="eyebrow-dot" aria-hidden="true"></span>Latest video</p>
            <h1 id="hero-title"></h1>
            <p id="hero-desc" class="featured-description"></p>
            <p id="hero-date" class="featured-date"></p>
            <a id="hero-watch" class="button button-primary" href="watch.html"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z" /></svg>Watch video<span aria-hidden="true">↗</span></a>
          </div>
        </article>
      </section>

      <section id="videos" class="videos-section" aria-labelledby="videos-title" aria-busy="true">
        <div class="videos-toolbar">
          <div class="videos-heading"><h2 id="videos-title">Videos <span id="videos-count" class="videos-count"></span></h2></div>
        </div>
        <section class="search-tools" id="search-tools">
          <button class="search-tools-toggle" type="button" data-disclosure aria-expanded="false" aria-controls="search-tools-body">Tags &amp; search tips<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="m6 9 6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          <div id="search-tools-body" class="search-tools-body" hidden>
            <p>Combine words, use <code>"a phrase"</code>, or exclude a word with <code>-word</code>. Use <code>tag:CS2</code> or <code>-tag:CS2</code> to include or exclude a tag. Names and aliases both work.</p>
            <label for="tag-search">Find a tag</label>
            <input id="tag-search" type="search" placeholder="Name or alias" autocomplete="off" spellcheck="false" />
            <div id="tag-suggestions" class="tag-suggestions" aria-label="Tags in this collection"></div>
            <p id="tag-suggestions-status" class="search-tools-note" role="status"></p>
          </div>
        </section>
        <div id="search-filters" class="search-filters" aria-label="Active tag filters" hidden></div>
        <p id="results-summary" class="results-summary" role="status" aria-live="polite">Loading videos…</p>
        <div id="videos-grid" class="video-grid" aria-label="Videos">
          <div class="skeleton-card" aria-hidden="true"><div class="skeleton-block skeleton-card-thumb"></div><div class="skeleton-card-content"><div class="skeleton-block skeleton-line"></div><div class="skeleton-block skeleton-line short"></div></div></div>
          <div class="skeleton-card" aria-hidden="true"><div class="skeleton-block skeleton-card-thumb"></div><div class="skeleton-card-content"><div class="skeleton-block skeleton-line"></div><div class="skeleton-block skeleton-line short"></div></div></div>
          <div class="skeleton-card" aria-hidden="true"><div class="skeleton-block skeleton-card-thumb"></div><div class="skeleton-card-content"><div class="skeleton-block skeleton-line"></div><div class="skeleton-block skeleton-line short"></div></div></div>
        </div>
        <div id="videos-status" class="status-panel" hidden>
          <span id="status-symbol" class="status-symbol" aria-hidden="true">↗</span>
          <h3 id="status-title"></h3>
          <p id="status-description"></p>
          <button id="status-action" class="button button-quiet" type="button" hidden>Try again</button>
        </div>
      </section>
      <noscript><div class="status-panel"><h2>JavaScript is needed to browse</h2><p>Enable JavaScript to load the videos and player.</p></div></noscript>
    </main>

  </body>
</html>
