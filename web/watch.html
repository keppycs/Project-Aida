<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Watch · Aida</title>
    <meta name="theme-color" content="#101112" />
    <link rel="icon" href="assets/favicons/flushed.svg" type="image/svg+xml" />

    <script src="https://cdn.jsdelivr.net/npm/shaka-player@5.0.7/dist/shaka-player.compiled.js" integrity="sha384-QmUMkgEfxfKsqPJEzI+KDHoe3v4Ci8Xql0RFiGN093TYQZUBJLXARMl8fVNhubqw" crossorigin="anonymous"></script>

    <link rel="stylesheet" href="css/site.css?v=ux-audit-v1" />
    <link rel="stylesheet" href="css/player.css?v=picture-surface-v39" />
    <link rel="stylesheet" href="css/player-mobile.css?v=picture-surface-v39" />
    <link rel="stylesheet" href="css/watch.css?v=ux-audit-v1" />
    <script defer src="js/site-env.js?v=ux-stability-v14"></script>
    <script defer src="js/ui.js?v=ux-baseline-v2"></script>
    <script type="module" src="js/watch.js?v=picture-surface-v39"></script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to video</a>
    <header class="site-header">
      <a class="brand" href="./" aria-label="Aida home">
        <span class="brand-mark" aria-hidden="true">a</span>
        <span class="brand-copy"><span class="brand-name">aida</span></span>
      </a>
    </header>
    <main id="main-content" class="site-main watch-main" tabindex="-1">
      <div class="watch-navigation">
        <a class="back-link" href="./"><span aria-hidden="true">←</span> Back to videos</a>
      </div>
      <section id="watch-stage" class="watch-stage" aria-label="Watch video" aria-busy="true">
        <div id="watch-status" class="watch-status" role="status" aria-live="polite">
          <div class="watch-status-content">
            <div id="watch-status-spinner" class="spin-ring" aria-hidden="true"></div>
            <h2 id="watch-status-title">Loading video</h2>
            <p id="watch-status-detail">Getting everything ready…</p>
            <div class="watch-status-actions">
              <button type="button" id="watch-retry" class="button button-primary" hidden>Try again</button>
              <a id="watch-status-videos" class="button button-quiet" href="./" hidden>All videos</a>
            </div>
          </div>
        </div>
    <div id="player-wrap" tabindex="0" aria-label="Video player" inert>
      <div id="player-picture">
        <video id="video" playsinline crossorigin="anonymous"></video>

        <div class="grad-top" aria-hidden="true"></div>
        <div class="grad-bot" aria-hidden="true"></div>

        <!-- Title -->
        <div id="title-bar">
          <div id="title-text">Video Title</div>
          <div class="title-spacer"></div>
          <div class="badge-accent" id="hdr-badge">—</div>
          <div class="badge-accent" id="codec-badge">—</div>
          <div class="badge-accent" id="protocol-badge">—</div>
          <div class="badge-accent" id="local-badge">LOCAL</div>
        </div>

        <!-- Big play -->
        <button id="big-play" type="button" aria-label="Play video">
          <svg viewBox="0 0 72 72" fill="none" aria-hidden="true">
            <circle cx="36" cy="36" r="35" fill="rgba(0,0,0,.55)" />
            <path
              d="M26.5 21.5 L52.5 36 L26.5 50.5 Z"
              fill="rgba(255,255,255,0.88)"
            />
          </svg>
        </button>

        <!-- Buffering -->
        <div id="spinner"><div class="spin-ring"></div></div>

        <!-- Seek flash -->
        <div id="seek-flash"></div>
        <div id="seek-ripple-left" class="seek-ripple" aria-hidden="true"></div>
        <div id="seek-ripple-right" class="seek-ripple" aria-hidden="true"></div>

        <!-- Keyboard toast -->
        <div id="kb-toast"></div>

        <!-- Controls -->
        <div id="progress-touch-target" aria-hidden="true"></div>
        <div id="controls">
          <!-- Progress -->
          <div id="progress-wrap" role="slider" tabindex="0" aria-label="Seek" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0" aria-valuetext="0:00">
            <div id="progress-track">
              <div id="progress-buffer"></div>
              <div id="progress-fill"></div>
            </div>
            <div id="progress-thumb"></div>
            <div id="time-tooltip">0:00</div>
          </div>

          <!-- Bottom row -->
          <div id="ctrl-row">
            <!-- Play/Pause -->
            <button class="ctrl-btn" id="play-btn" type="button" title="Play (K)" aria-label="Play">
              <svg id="play-icon" viewBox="0 0 24 24" fill="currentColor">
                <polygon points="5,3 19,12 5,21" />
              </svg>
            </button>

            <!-- Volume -->
            <div id="vol-cluster">
              <button class="ctrl-btn" id="mute-btn" type="button" title="Mute (M)" aria-label="Mute">
                <svg
                  id="vol-icon"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
                  <path id="vol-wave-1" d="M19.07 4.93a10 10 0 0 1 0 14.14" />
                  <path id="vol-wave-2" d="M15.54 8.46a5 5 0 0 1 0 7.07" />
                </svg>
              </button>
              <div id="vol-slider-wrap">
                <input type="range" id="vol-slider" min="0" max="1" step="0.01" value="0.5" aria-label="Volume" />
              </div>
            </div>

            <!-- Time -->
            <div id="time-display">
              <span id="cur-time">0:00</span><span> / </span><span id="dur-time">0:00</span>
            </div>

            <div class="spacer"></div>

            <button class="ctrl-btn" id="settings-btn" type="button" title="Settings" aria-label="Settings" aria-controls="settings-panel" aria-expanded="false">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="m9.7 3-.5 2-2 .9-1.9-.6-2.4 4.2 1.5 1.5v2l-1.5 1.5 2.4 4.2 1.9-.6 2 .9.5 2h4.6l.5-2 2-.9 1.9.6 2.4-4.2-1.5-1.5v-2l1.5-1.5-2.4-4.2-1.9.6-2-.9-.5-2Z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            </button>

            <!-- Fullscreen -->
            <button class="ctrl-btn" id="fs-btn" type="button" title="Fullscreen (F)" aria-label="Enter fullscreen">
              <svg
                id="fs-icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <polyline points="15 3 21 3 21 9" />
                <polyline points="9 21 3 21 3 15" />
                <line x1="21" y1="3" x2="14" y2="10" />
                <line x1="3" y1="21" x2="10" y2="14" />
              </svg>
            </button>
          </div>
        </div>

      </div>

      <div id="menu-backdrop" class="menu-backdrop" aria-hidden="true"></div>
      <!-- One contained surface owns Settings and its detail pages. -->
      <section id="settings-panel" class="player-settings" role="dialog" aria-labelledby="settings-heading" hidden inert>
        <div id="settings-surface" class="settings-surface">
        <div class="settings-header">
          <button id="settings-back" class="settings-icon" type="button" aria-label="Back to settings" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m14 6-6 6 6 6" /></svg>
          </button>
          <h2 id="settings-heading" tabindex="-1">Settings</h2>
          <button id="settings-close" class="settings-icon" type="button" aria-label="Close settings">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" /></svg>
          </button>
        </div>
        <div id="settings-body">
          <div id="settings-home" class="settings-page" role="group" aria-label="Player settings">
            <button class="menu-item settings-row" id="smooth-pause-toggle" type="button" role="switch" aria-label="Smooth Pause" aria-checked="false" title="Ease video and audio when pausing or resuming">
              <span>Smooth Pause</span><span class="setting-value" id="smooth-pause-value" aria-hidden="true">Off</span><span class="setting-switch" aria-hidden="true"></span>
            </button>
            <button class="menu-item settings-row" id="speed-btn" type="button" aria-controls="speed-menu" aria-expanded="false">
              <span>Playback speed</span><span class="setting-value" id="speed-label">Normal</span><span class="menu-chevron" aria-hidden="true">›</span>
            </button>
            <button class="menu-item settings-row" id="quality-btn" type="button" aria-controls="quality-menu" aria-expanded="false">
              <span>Quality</span><span class="setting-value" id="quality-label">Auto</span><span class="menu-chevron" aria-hidden="true">›</span>
            </button>
            <div id="cc-wrap" style="display: none">
              <button class="menu-item settings-row" id="cc-btn" type="button" aria-controls="cc-menu" aria-expanded="false">
                <span>Color correction</span><span class="setting-value" id="cc-label">Off</span><span class="menu-chevron" aria-hidden="true">›</span>
              </button>
            </div>
          </div>
          <div id="speed-menu" class="settings-page" role="group" aria-label="Playback speed" hidden inert>
            <button class="menu-item" type="button" data-speed="0.25">0.25×</button>
            <button class="menu-item" type="button" data-speed="0.5">0.5×</button>
            <button class="menu-item" type="button" data-speed="0.75">0.75×</button>
            <button class="menu-item active" type="button" data-speed="1">Normal</button>
            <button class="menu-item" type="button" data-speed="1.25">1.25×</button>
            <button class="menu-item" type="button" data-speed="1.5">1.5×</button>
            <button class="menu-item" type="button" data-speed="2">2×</button>
          </div>
          <div id="quality-menu" class="settings-page" role="group" aria-label="Video quality" hidden inert>
            <div id="quality-menu-content"></div>
          </div>
          <div id="cc-menu" class="settings-page" role="group" aria-label="Color correction" hidden inert>
            <p class="menu-hint">Adjust HDR appearance on this display.</p>
            <div class="cc-toggle-row menu-toggle-row">
              <button type="button" class="menu-toggle" id="cc-off" data-cc-enable="0">Off</button>
              <button type="button" class="menu-toggle" id="cc-on" data-cc-enable="1">On</button>
            </div>
            <div class="cc-sliders">
              <div class="cc-slider-row">
                <label class="cc-label" for="cc-brightness">Brightness</label>
                <input type="range" class="cc-slider" id="cc-brightness" min="0.5" max="2" step="0.01" value="1.1" />
                <span class="cc-val" id="cc-brightness-val">1.10</span>
              </div>
              <div class="cc-slider-row">
                <label class="cc-label" for="cc-contrast">Contrast</label>
                <input type="range" class="cc-slider" id="cc-contrast" min="0.5" max="2.5" step="0.01" value="1.7" />
                <span class="cc-val" id="cc-contrast-val">1.70</span>
              </div>
              <div class="cc-slider-row">
                <label class="cc-label" for="cc-saturation">Saturation</label>
                <input type="range" class="cc-slider" id="cc-saturation" min="0" max="2" step="0.01" value="1.1" />
                <span class="cc-val" id="cc-saturation-val">1.10</span>
              </div>
            </div>
          </div>
        </div>
        <div id="settings-scroll-thumb" role="scrollbar" aria-label="Scroll settings" aria-controls="settings-body" aria-orientation="vertical" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0" tabindex="0" hidden></div>
        </div>
      </section>

    </div>
      </section>
      <noscript><p class="status-panel">Enable JavaScript to play this video. <a class="text-link" href="./">Back to videos</a></p></noscript>
      <section class="watch-info" aria-labelledby="watch-title">
        <h1 id="watch-title">Getting your video ready</h1>
        <div id="watch-meta" class="watch-meta"></div>
        <p id="watch-description" class="watch-description" hidden></p>
        <div id="watch-tags" class="watch-tags" aria-label="Video tags" hidden></div>
      </section>
      <section id="more-videos" class="more-videos" aria-labelledby="more-videos-title" hidden>
        <div class="section-heading"><h2 id="more-videos-title">More to watch</h2><a class="text-link" href="./">All videos <span aria-hidden="true">↗</span></a></div>
        <div id="more-videos-grid" class="video-grid"></div>
      </section>
    </main>
  </body>
</html>
